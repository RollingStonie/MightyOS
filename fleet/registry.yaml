# fleet/registry.yaml — who each agent is, what tools they use, what they produce
# Read by all agents at session start. Written only by Kenneth/Claire.
#
# Unified capability grant model (M016 spec 2026-07-23 § Unified capability grant model):
#   grants[]    — capability tokens this agent may exercise. A task/manifest may only be
#                 routed to an agent whose grants ⊇ the task capability + manifest
#                 grants_required. Derived conservatively from `capabilities` + role.
#   forbidden[] — hard registry-level denials. A manifest can NARROW an agent's grants,
#                 never WIDEN them; forbidden always wins over any grant.
#   state       — lifecycle state (M016 spec § Agent lifecycle states):
#                 registered → provisioned → probation → ready → degraded → retired.
#   discord_identity / infisical_identity — one declaration from which Discord + Infisical
#                 scopes derive. Infisical machine identities are `planned` (INFRA-01, not
#                 yet provisioned); names are reserved here so manifests can reference them.
#   tailscale   — MagicDNS name (IP kept in tailscale_ip for backward compat).
#
# PLATFORM BOUNDARY (decided 2026-08-05): QM is the preferred employee-facing
# platform for a gated pilot; it is NOT a fleet agent and therefore has no row
# in this registry. A008 remains the governance/delivery kernel, Plane remains
# the sole company work ledger, and Hermes remains the edge runtime for the
# device/profile identities below. Buzz is reference-only during the QM pilot.
# No Mike/Mighty service was changed when this decision was recorded.
#
# EDIT-SURFACE NOTE (decided 2026-07-23, M016 spec Revision pt 3): the fleet registry's
# canonical EDIT SURFACE is moving to A008 (AG_APP/A008_Agentic OS/registry/agents.yaml);
# A008 CI will compile + publish this file into MightyOS so the 5-min device git-pull
# distribution channel keeps working. Until that CI-publish step exists, this file remains
# both edit surface and distribution channel. Do not fork a second registry.

